<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0e1f" />
  <title>Grimoire du Conteur — Blood on the Clocktower</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="btn-menu" class="icon-btn" aria-label="Menu">☰</button>
      <span class="brand">🕰️ <span class="brand-name" data-i18n="appName">Grimoire du Conteur</span></span>
    </div>
    <div class="topbar-center">
      <span id="script-name" class="script-name">Trouble Brewing</span>
      <span id="phase-badge" class="phase-badge"></span>
    </div>
    <div class="topbar-right">
      <button id="btn-sound" class="icon-btn" aria-label="Sons" title="Sons">🔔</button>
      <button id="lang-fr" class="lang-btn active">FR</button>
      <button id="lang-en" class="lang-btn">EN</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="grimoire" data-i18n="tab.grimoire">Grimoire</button>
    <button class="tab" data-view="night" data-i18n="tab.night">Nuit</button>
    <button class="tab" data-view="day" data-i18n="tab.day">Jour</button>
    <button class="tab" data-view="setup" data-i18n="tab.setup">Setup</button>
    <button class="tab" data-view="reference" data-i18n="tab.reference">Personnages</button>
    <button class="tab" data-view="scripts" data-i18n="tab.scripts">Scripts</button>
  </nav>

  <main id="app">
    <section id="view-grimoire" class="view active"></section>
    <section id="view-night" class="view"></section>
    <section id="view-day" class="view"></section>
    <section id="view-setup" class="view"></section>
    <section id="view-reference" class="view"></section>
    <section id="view-scripts" class="view"></section>
  </main>

  <!-- Modale générique -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
